[project]
name = "langfuse-sys"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.0",
    "langchain-core>=1.6.3",
    "langchain-openai>=1.6.2",
    "langfuse>=3.0",
    "langgraph>=1.2.11",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "psycopg[binary]>=3.3.5",
    "ipykernel>=7.3.0",
    "rich>=15.0.0",
    "langgraph-checkpoint-postgres>=3.2.0",
    "chevron>=0.14.0",
    # spec 005: Streamlit single-page UI (per FR-015 + ADR-0006)
    "streamlit>=1.30.0,<2.0",
    "dashscope>=1.27.8",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    # spec 005: pytest + coverage + asyncio (per FR-016 + Constitution Principle III)
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "pytest-asyncio>=0.23,<1.0",
]

# spec 005 pytest config (per FR-022 + R2)
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
